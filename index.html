<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="todo-container">
        <div class="header"></div>
        <div class="content">
            <h2>To-Do List</h2>

            <div class="filter-wrapper">
                <button id="sortButton" onclick="toggleSort()">
                    <i id="sortIcon" class="fa-solid fa-arrow-down-a-z"></i>
                </button>
            </div>

            <div class="input-container" id="inputContainer">
                <input type="text" id="taskInput" placeholder="Введите задачу...">
                <button class="clear-btn" onclick="clearInput()">✕</button>
            </div>

            <ul id="taskList" class="task-list"></ul>

            <button class="add-button">
                <span class="add-icon" onclick="toggleInput()">＋</span>
                <span class="add-text" onclick="addTask()">Добавить</span>
            </button>

        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
